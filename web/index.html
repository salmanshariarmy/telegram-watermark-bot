<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no"
>

<title>CleanMedia</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #111827;

    color: white;

    font-family:
        Arial,
        sans-serif;
}

.header {

    padding: 15px;

    text-align: center;
}

.header h2 {

    margin: 0 0 6px;
}

.header p {

    margin: 0;

    color: #9ca3af;
}

#area {

    position: relative;

    width: 95%;

    max-width: 900px;

    margin: 10px auto;

    overflow: hidden;

    background: black;

    border-radius: 10px;

    touch-action: none;
}

#preview {

    display: block;

    width: 100%;

    height: auto;

    user-select: none;

    -webkit-user-drag: none;
}

#box {

    position: absolute;

    display: none;

    border: 3px solid #22c55e;

    background:
        rgba(34, 197, 94, 0.25);

    pointer-events: none;
}

#status {

    text-align: center;

    padding: 12px;

    color: #d1d5db;
}

button {

    display: block;

    width: 90%;

    max-width: 500px;

    margin: 10px auto 25px;

    padding: 15px;

    border: 0;

    border-radius: 10px;

    background: #22c55e;

    color: white;

    font-size: 17px;

    font-weight: bold;
}

button:disabled {

    opacity: 0.4;
}

</style>

</head>

<body>


<div class="header">

    <h2>🧹 CleanMedia</h2>

    <p>
        Draw a rectangle around your watermark
    </p>

</div>


<div id="area">

    <img
        id="preview"
        alt="Preview"
    >

    <div id="box"></div>

</div>


<div id="status">
    Loading...
</div>


<button
    id="remove"
    disabled
>
    Remove Watermark
</button>


<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const fileId =
    params.get("file_id");


const preview =
    document.getElementById(
        "preview"
    );


const area =
    document.getElementById(
        "area"
    );


const box =
    document.getElementById(
        "box"
    );


const status =
    document.getElementById(
        "status"
    );


const button =
    document.getElementById(
        "remove"
    );


let drawing = false;

let startX = 0;

let startY = 0;

let selection = null;


if (!fileId) {

    status.innerText =
        "❌ Missing file ID.";

    throw new Error(
        "Missing file_id"
    );
}


preview.src =
    "/preview/" +
    encodeURIComponent(
        fileId
    );


preview.onload = function() {

    status.innerText =
        "Draw a box around your watermark.";

};


preview.onerror = function() {

    status.innerText =
        "❌ Could not load preview.";

};


function getPosition(event) {

    const rect =
        area.getBoundingClientRect();


    let x =
        event.clientX -
        rect.left;


    let y =
        event.clientY -
        rect.top;


    x = Math.max(
        0,
        Math.min(
            x,
            rect.width
        )
    );


    y = Math.max(
        0,
        Math.min(
            y,
            rect.height
        )
    );


    return {
        x: x,
        y: y
    };
}


area.addEventListener(
    "pointerdown",
    function(event) {

        event.preventDefault();

        drawing = true;

        area.setPointerCapture(
            event.pointerId
        );


        const p =
            getPosition(event);


        startX = p.x;

        startY = p.y;


        box.style.display =
            "block";


        box.style.left =
            startX + "px";


        box.style.top =
            startY + "px";


        box.style.width =
            "0px";


        box.style.height =
            "0px";


        selection = null;

        button.disabled = true;

    }
);


area.addEventListener(
    "pointermove",
    function(event) {

        if (!drawing)
            return;


        event.preventDefault();


        const p =
            getPosition(event);


        const left =
            Math.min(
                startX,
                p.x
            );


        const top =
            Math.min(
                startY,
                p.y
            );


        const width =
            Math.abs(
                p.x -
                startX
            );


        const height =
            Math.abs(
                p.y -
                startY
            );


        box.style.left =
            left + "px";


        box.style.top =
            top + "px";


        box.style.width =
            width + "px";


        box.style.height =
            height + "px";


        selection = {

            left: left,

            top: top,

            width: width,

            height: height

        };


        if (
            width > 5 &&
            height > 5
        ) {

            button.disabled =
                false;

            status.innerText =
                "Watermark selected.";

        }

    }
);


area.addEventListener(
    "pointerup",
    function(event) {

        drawing = false;

        try {

            area.releasePointerCapture(
                event.pointerId
            );

        } catch (e) {}

    }
);


button.addEventListener(
    "click",
    async function() {

        if (!selection)
            return;


        button.disabled = true;


        status.innerText =
            "⏳ Removing watermark...";


        /*
         * Convert screen coordinates
         * into original media coordinates.
         */

        const scaleX =
            preview.naturalWidth /
            preview.clientWidth;


        const scaleY =
            preview.naturalHeight /
            preview.clientHeight;


        const x =
            Math.round(
                selection.left *
                scaleX
            );


        const y =
            Math.round(
                selection.top *
                scaleY
            );


        const width =
            Math.round(
                selection.width *
                scaleX
            );


        const height =
            Math.round(
                selection.height *
                scaleY
            );


        const requestData = {

            file_id: fileId,

            x: x,

            y: y,

            width: width,

            height: height

        };


        console.log(
            "Sending:",
            requestData
        );


        try {

            const response =
                await fetch(
                    "/process",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                requestData
                            )

                    }
                );


            const text =
                await response.text();


            console.log(
                "Server response:",
                text
            );


            let result;


            try {

                result =
                    JSON.parse(text);

            } catch (e) {

                throw new Error(
                    "Server returned invalid response."
                );

            }


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.error ||
                    "Processing failed."
                );

            }


            status.innerText =
                "✅ Done! Check Telegram for your cleaned file.";

        }
        catch (error) {

            console.error(
                "Processing error:",
                error
            );


            status.innerText =
                "❌ " +
                error.message;


            button.disabled =
                false;

        }

    }
);

</script>

</body>

</html>
